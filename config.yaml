# Configuration for Narrative Similarity Training
#
# This configuration implements recommendations from APPROACH.md
# See APPROACH.md for detailed explanation of each technique and parameter

# General settings
seed: 42
device: cuda  # or cpu

# Data paths
data:
  dev_track_a: "data/dev_track_a.jsonl"
  dev_track_b: "data/dev_track_b.jsonl"
  output_dir: "output"
  prepared_data_dir: "data/prepared"

# Track B - Bi-encoder settings
track_b:
  base_model: "BAAI/bge-large-en-v1.5"  # High-perf backbone per APPROACH
  model_save_path: "models/track_b_embedder"
  # Training hyperparameters (split by curriculum stages)
  batch_size: 8
  batch_size_mnr: 8
  batch_size_pairwise: 8
  batch_size_triplet: 8
  batch_size_distill: 8
  epochs_mnr: 3          # Phase 1: MultipleNegativesRankingLoss
  epochs_pairwise: 4     # Phase 2: PairwiseSoftmaxLoss (metric-aligned)
  epochs_triplet: 3      # Phase 3: TripletLoss with hard negatives
  learning_rate: 1.0e-5
  warmup_steps: 500
  weight_decay: 0.01
  triplet_margin: 0.5
  use_multiple_negatives_ranking: true
  use_pairwise_softmax: true
  temperature: 0.7       # Sharper softmax per APPROACH
  # Distillation from Track A cross-encoder (Stage 3 in APPROACH)
  distill_from_teacher: false
  teacher_model_path: "models/track_a_cross_encoder"
  distill_weight: 0.3
  distill_temperature: 0.7
  # Training options
  mixed_precision: true
  gradient_clip: 1.0
  grad_accum_steps: 2
  enable_gradient_checkpointing: true
  eval_steps: 100

# Track A - Cross-encoder settings
track_a:
  base_model: "BAAI/bge-large-en-v1.5"  # Share backbone with Track B
  model_save_path: "models/track_a_cross_encoder"
  # Training hyperparameters
  batch_size: 4  # Pairwise scoring doubles inputs; adjust for large model
  epochs: 5
  learning_rate: 1.0e-5
  warmup_ratio: 0.1
  weight_decay: 0.01
  # Model configuration
  max_length: 512
  num_labels: 2
  label_smoothing: 0.0
  temperature: 0.7      # Sharper logits for better discrimination
  # Distillation regularizer from Track B (Stage 2 warm prior)
  distill_from_biencoder: true
  teacher_biencoder_path: "models/track_b_embedder"
  distill_weight: 0.3
  distill_temperature: 0.7
  # Training options
  mixed_precision: true
  gradient_clip: 1.0
  eval_steps: 50
  use_kfold: true
  n_folds: 5
  # Ensemble settings
  use_ensemble: true
  ensemble_method: "average"

# Data augmentation
augmentation:
  enable: true
  swap_ab: true

