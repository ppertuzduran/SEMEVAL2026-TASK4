# Configuration for Narrative Similarity Training
#
# This configuration implements recommendations from APPROACH.md
# See APPROACH.md for detailed explanation of each technique and parameter
#Final v10
# General settings
seed: 42
device: cuda  # or cpu

# Data paths
data:
  dev_track_a: "data/dev_track_a.jsonl"
  dev_track_b: "data/dev_track_b.jsonl"
  output_dir: "output"
  prepared_data_dir: "data/prepared"

# Track B - Bi-encoder settings (v11: Qwen3-Embedding-0.6B backbone)
track_b:
  base_model: "Qwen/Qwen3-Embedding-0.6B"  # v11: Upgraded backbone per APPROACH.md
  model_save_path: "models/track_b_embedder"
  # V10 Architecture: Projection head for dimensionality reduction
  projection_dim: 512      # Reduce from 1024 to 512 for better generalization
  projection_dropout: 0.0  # Will be tuned via experiments (grid: 0.0, 0.1, 0.2)
  # Composite loss weights (v2 unified training)
  loss_weights:
    margin: 1.0            # MarginRankingLoss weight
    pairwise: 0.5          # PairwiseSoftmaxLoss weight
    mnr: 0.5               # MultipleNegativesRankingLoss weight
    simcse: 0.0            # SimCSE consistency loss weight (optional, enabled by experiments)
  margin: 0.05              # Margin for MarginRankingLoss
  # Training hyperparameters
  batch_size: 4            # Reduced for composite loss (more memory intensive)
  epochs: 4                # Unified training phase
  learning_rate: 2.0e-5
  warmup_steps: 500
  weight_decay: 0.01       # Weight decay for backbone
  projection_weight_decay: 0.05  # Projection head weight decay (tuned via experiments)
  temperature: 0.5         # Sharper softmax per APPROACH
  max_seq_length: 384      # shorten sequences to save VRAM on T4
  # Hard Negative Mining (v11: disabled by default for clean baseline)
  enable_hard_negatives: false  # v11: Disabled per APPROACH.md (simplified loss)
  hard_negative_k: 5            # Number of hard negatives per anchor (grid: 3, 5, 7)
  hard_negative_epochs: 2       # Extra epochs on hard negatives (grid: 1, 2)
  # Hyperparameter Sweep (recommended)
  enable_hyperparam_sweep: true  # Set to true for post-training sweep
  temperature_grid: [0.5, 0.7, 0.9, 1.1]  # Temperature values to test
  margin_grid: [0.05, 0.1, 0.2, 0.3]      # Margin values to test
  # SimCSE Consistency Loss (v11: disabled by default for clean baseline)
  enable_simcse: false   # v11: Disabled per APPROACH.md (simplified loss)
  # Training options
  mixed_precision: true
  gradient_clip: 1.0
  grad_accum_steps: 2
  enable_gradient_checkpointing: true
  eval_steps: 100

# Track A - MLP Head settings (v10: systematic hyperparameter tuning)
track_a:
  architecture: "mlp_head"  # v2: MLP head instead of cross-encoder
  model_save_path: "models/track_a_mlp_head"
  # Track B dependency (must be trained first)
  track_b_model_path: "models/track_b_embedder"  # Relative path (works on Windows and Colab)
  freeze_track_b: true      # Head-only training (recommended first)
  # MLP Head architecture (tuned via experiments)
  mlp_hidden_dim: 512       # Hidden dimension (grid: 512, 1024)
  mlp_dropout: 0.2          # Dropout (grid: 0.1, 0.2, 0.3)
  # Training hyperparameters
  batch_size: 16            # Can be larger since we're just training MLP head
  epochs: 5                 # Training epochs
  learning_rate: 1.0e-4     # Higher LR for head-only training (grid: 5e-5, 1e-4, 2e-4)
  warmup_ratio: 0.1
  weight_decay: 0.01
  # Loss configuration
  label_smoothing: 0.0
  temperature: 1.0          # Temperature for MLP scores
  # Distillation from Track B cosine similarities (tuned via experiments)
  distill_weight: 0.3       # KL divergence weight from Track B (grid: 0.0, 0.3, 0.5)
  distill_temperature: 2.0  # Temperature for distillation
  # Training options
  mixed_precision: true
  gradient_clip: 1.0
  eval_steps: 50
  use_kfold: true
  n_folds: 5
  # Ensemble settings
  use_ensemble: true
  ensemble_method: "average"
  # To run only specific folds (0-based), set e.g. [4] for fold 5 only
  folds_to_train: null      # null means train all folds
  # Optional late fusion
  use_late_fusion: false    # Combine Track B + Track A scores

# Data augmentation
augmentation:
  # Use augmented data for training
  use_augmented_data: true  # Set to true after running augment_training_data.py
  
  # Augmentation strategies (for generation via augment_training_data.py)
  strategies:
    paraphrasing:
      enable: true
      model: "Vamsi/T5_Paraphrase_Paws"  # Offline T5 paraphraser
      num_beams: 5
      temperature: 1.2
    
    synonym_replacement:
      enable: true
      replacement_prob: 0.15
      max_replacements: 3
  
  # Augmentation parameters
  n_augmentations: 2  # Generate 2 augmented versions per example (3x total data)
  min_similarity: 0.3  # Filter out augmentations too different from original
  max_similarity: 0.9  # Filter out augmentations too similar to original


