# Configuration for Narrative Similarity Training

# General settings
seed: 42
device: cuda  # or cpu

# Data paths
data:
  dev_track_a: "data/dev_track_a.jsonl"
  dev_track_b: "data/dev_track_b.jsonl"
  output_dir: "output"
  prepared_data_dir: "data/prepared"

# Track B - Bi-encoder settings
track_b:
  base_model: "BAAI/bge-base-en-v1.5"  # 109M params, 768-dim embeddings. BGE outperforms MiniLM and base sentence-transformers
  model_save_path: "models/track_b_embedder"
  
  # Training hyperparameters
  batch_size: 24  # Optimal for 6GB GPU, increase to 32 on Colab T4 (16GB)
  epochs: 10
  learning_rate: 1.0e-5  # Lower LR for fine-tuning BGE
  warmup_steps: 100
  weight_decay: 0.01
  
  # Loss configuration
  triplet_margin: 0.5
  use_multiple_negatives_ranking: true
  use_pairwise_softmax: true  # Direct metric optimization (Phase 1)
  
  # Training options
  mixed_precision: true
  gradient_clip: 1.0
  eval_steps: 100

# Track A - Cross-encoder settings
track_a:
  base_model: "roberta-large"  # 355M params, proven performance on narrative similarity
  model_save_path: "models/track_a_cross_encoder"
  
  # Training hyperparameters
  batch_size: 6  # Reduced for RoBERTa-large and pairwise scoring (processes 2x inputs)
  epochs: 5
  learning_rate: 1.0e-5  # Lower LR for large model fine-tuning
  warmup_ratio: 0.1
  weight_decay: 0.01
  
  # Model configuration
  max_length: 512  # RoBERTa max length (per pair)
  num_labels: 2
  label_smoothing: 0.0  # No smoothing for better signal in pairwise task
  
  # Training options
  mixed_precision: true
  gradient_clip: 1.0
  eval_steps: 50
  use_kfold: true
  n_folds: 5
  
  # Ensemble settings (optional)
  use_ensemble: false

# Data augmentation
augmentation:
  swap_ab: true  # Systematic A/B position swap (doubles training data, removes position bias)

